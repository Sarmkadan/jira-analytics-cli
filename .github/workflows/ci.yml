name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Pass the .sln explicitly: the repo root has both a .sln and a .slnx,
      # so a bare `dotnet restore` fails with MSB1011. The .sln also includes the test project.
      - name: Restore dependencies
        run: dotnet restore jira-analytics-cli.sln

      - name: Build
        run: dotnet build jira-analytics-cli.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test jira-analytics-cli.sln --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          retention-days: 14
